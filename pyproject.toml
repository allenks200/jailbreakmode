[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "allenks200-jailbreakmode"
version = "0.1.0"
description = "按角色扮演、假设语气、编码绕行等模式检测越狱尝试并标注"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "allenks200" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://allenks200.github.io"
Repository = "https://github.com/allenks200/jailbreakmode"
Issues = "https://github.com/allenks200/jailbreakmode/issues"

[project.scripts]
jailbreakmode = "jailbreakmode:main"

[tool.setuptools]
py-modules = ["jailbreakmode"]
